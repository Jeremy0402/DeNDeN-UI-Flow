name: 同步 Lark UI Flow

on:
  schedule:
    # GitHub 排程用 UTC；台北時間 = UTC+8。公開 repo 的 Actions 免費不限分鐘，
    # 所以用 GitHub 允許的最短間隔（5 分鐘）。內容沒變動時不會 commit，也不會觸發網站重新部署。
    - cron: '*/5 1-10 * * 1-5'          # 平日台北 09:00–18:59，每 5 分鐘
    - cron: '*/15 11-23,0 * * 1-5'      # 平日其他時段，每 15 分鐘
    - cron: '*/15 * * * 0,6'            # 週末（UTC 週六、週日），每 15 分鐘
  workflow_dispatch: {}                 # 在 GitHub 網頁上可以手動按「Run workflow」立刻同步

permissions:
  contents: write

concurrency:
  group: sync-lark
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 向 Lark 抓取最新文件與圖片
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          if [ -z "$LARK_APP_ID" ] || [ -z "$LARK_APP_SECRET" ]; then
            echo "尚未設定 LARK_APP_ID / LARK_APP_SECRET（Settings → Secrets and variables → Actions），略過同步。"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          node scripts/sync-lark.mjs

      - name: 有新圖片時安裝 WebP 轉檔工具
        if: env.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain site/img)" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq webp
          fi

      - name: 圖片轉 WebP、產生縮圖並重新建置網站資料
        if: env.skip != 'true'
        run: |
          node scripts/optimize-images.mjs
          node scripts/build.mjs --prune

      - name: 只有內容真的變動時才提交
        if: env.skip != 'true'
        run: |
          git config user.name "lark-sync-bot"
          git config user.email "actions@github.com"
          # builtAt 每次都不同，所以只看內容與圖片是否有變，避免每 20 分鐘就產生一次 commit
          if [ -z "$(git status --porcelain content site/img site/thumbs)" ]; then
            echo "Lark 內容沒有變動，不提交。"
            exit 0
          fi
          git add -A
          git commit -m "同步 Lark UI Flow 文件"
          git push
