<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeNDeN UI Flow</title>
<meta name="description" content="AmpGO、全支付充電漫遊的操作畫面圖解：一步一步看流程，遇到問題用畫面找原因。">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
<script>/* 在畫面出現前套用使用者選的外觀，避免閃一下 */try{var t=localStorage.getItem('uf.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <img class="brand-logo" src="img/brand/dendan-logo.svg" alt="電電數位">
    <span class="brand-divider" aria-hidden="true"></span>
    <span class="brand-text"><span class="brand-title"><span aria-hidden="true">⚡</span><span id="brand-title">DeNDeN UI Flow</span><span class="internal-badge" title="僅限內部人員使用，內容請勿外流"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>內部專用</span></span><span class="brand-sub" id="brand-sub"></span></span>
  </a>
  <div class="search" role="search">
    <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="搜尋畫面或問題，例如：拔不出來、發票" aria-label="搜尋">
    <span class="s-icon" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    <button type="button" class="s-clear" id="q-clear" aria-label="清除搜尋" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <nav class="top-nav" aria-label="主要頁面"><a href="#/" data-nav="home">流程總覽</a><a href="#/e" data-nav="e">看畫面找問題</a></nav>
  <div class="top-tools">
    <div class="notices-wrap">
      <button type="button" class="notices-chip" id="notices-chip" aria-haspopup="dialog" aria-expanded="false" aria-controls="notices-panel" title="近期更新">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notices-label">近期更新</span><span class="notices-badge" id="notices-badge" hidden></span>
      </button>
      <div class="notices-panel" id="notices-panel" role="dialog" aria-label="近期更新" hidden>
        <div class="notices-head"><span>近期更新</span><button type="button" class="notices-markall" id="notices-markall">全部標為已讀</button></div>
        <div class="notices-sync" id="notices-sync"></div>
        <div class="notices-list" id="notices-list"></div>
      </div>
    </div>
    <span class="sync-chip" id="sync-chip" title="Lark 內容最後一次有變動的時間。內容沒變時，這個時間不會更新。"><span class="dot"></span><span id="sync-text"></span></span>
  </div>
</header>
<nav class="channelbar" id="channelbar" aria-label="通路"></nav>
<main id="app"></main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="放大畫面" hidden>
  <div class="lb-scroll"><img class="lb-img" id="lb-img" alt=""></div>
  <div class="lb-cap" id="lb-cap"></div>
  <button type="button" class="lb-close" aria-label="關閉"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript>請開啟瀏覽器的 JavaScript 才能使用本頁。</noscript>
<script src="data/flows.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
